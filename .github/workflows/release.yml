# Builds AudiobookDownload.exe and its installer on GitHub and publishes them as a release.
#
# Start it either way:
#   - push a version tag:      git tag v1.3.0 && git push origin v1.3.0
#   - or on GitHub: Actions, Release, Run workflow, and type the version (1.3.0).
#
# The release notes are the version's section of CHANGELOG.md, so write that first.
#
# Code signing (optional): add two repository secrets, SIGNING_CERT_BASE64 (the
# .pfx certificate, base64-encoded) and SIGNING_CERT_PASSWORD, and every release is
# signed, so Windows SmartScreen stops warning. Without them the step is skipped.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, for example 1.3.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      SIGNING_CERT: ${{ secrets.SIGNING_CERT_BASE64 }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}' }
          $version = $version.Trim().TrimStart('v', 'V')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "'$version' is not a version like 1.3.0." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build the single-file exe
        shell: pwsh
        run: |
          dotnet publish src/AudiobookDownloader.WinForms/AudiobookDownloader.WinForms.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.version.outputs.version }} `
            -o out
          New-Item -ItemType Directory -Force release | Out-Null
          Move-Item out/AudiobookDownloader.WinForms.exe release/AudiobookDownload.exe

      - name: Sign the exe (only when a certificate is configured)
        if: env.SIGNING_CERT != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERT))
          try {
            $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
            $signtool = Get-ChildItem $kits -Recurse -Filter signtool.exe |
              Where-Object { $_.Directory.Name -eq 'x64' } | Sort-Object FullName | Select-Object -Last 1
            & $signtool.FullName sign /f $pfx /p $env:SIGNING_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d 'Audiobook Downloader' release/AudiobookDownload.exe
            if ($LASTEXITCODE -ne 0) { throw 'Signing failed.' }
            & $signtool.FullName verify /pa release/AudiobookDownload.exe
            if ($LASTEXITCODE -ne 0) { throw 'The signature does not verify.' }
          }
          finally { Remove-Item $pfx -ErrorAction SilentlyContinue }

      - name: Self-test the exe on its own
        shell: pwsh
        run: |
          # Run from a folder that holds nothing else, the way people will run it.
          $run = Start-Process -FilePath release/AudiobookDownload.exe -ArgumentList '--self-test', "$PWD/self-test-report.txt" -WorkingDirectory release -Wait -PassThru
          Get-Content self-test-report.txt
          if ($run.ExitCode -ne 0) { throw "The self-test found problems (exit code $($run.ExitCode)); nothing was released." }

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "/DSourceExe=$PWD\release\AudiobookDownload.exe" "/O$PWD\release" installer\AudiobookDownloader.iss
          if ($LASTEXITCODE -ne 0) { throw 'The installer could not be built.' }

      - name: Sign the installer (only when a certificate is configured)
        if: env.SIGNING_CERT != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERT))
          try {
            $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
            $signtool = Get-ChildItem $kits -Recurse -Filter signtool.exe |
              Where-Object { $_.Directory.Name -eq 'x64' } | Sort-Object FullName | Select-Object -Last 1
            $setup = Get-ChildItem release -Filter 'AudiobookDownloader-Setup-*.exe' | Select-Object -First 1
            & $signtool.FullName sign /f $pfx /p $env:SIGNING_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d 'Audiobook Downloader Setup' $setup.FullName
            if ($LASTEXITCODE -ne 0) { throw 'Signing the installer failed.' }
          }
          finally { Remove-Item $pfx -ErrorAction SilentlyContinue }

      - name: Install, self-test the installed copy, uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter 'AudiobookDownloader-Setup-*.exe' | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'installed'
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$dir" -Wait
          # Setup starts the app when it finishes, as it does after an update.
          Start-Sleep -Seconds 5
          Get-Process AudiobookDownload -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not (Test-Path "$dir\AudiobookDownload.exe")) { throw 'The installer did not install the app.' }
          if (-not (Test-Path "$dir\unins000.exe")) { throw 'The installer did not install an uninstaller.' }
          $run = Start-Process "$dir\AudiobookDownload.exe" -ArgumentList '--self-test', "$PWD/installed-self-test.txt" -WorkingDirectory $dir -Wait -PassThru
          Get-Content installed-self-test.txt | Select-Object -Last 3
          if ($run.ExitCode -ne 0) { throw "The installed app's self-test found problems." }
          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\AudiobookDownload.exe") { throw 'Uninstalling left the app behind.' }

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]").LineNumber
          if (-not $start) { throw "CHANGELOG.md has no section for $version; add one before releasing." }
          $rest = $lines[$start..($lines.Count - 1)]
          $end = ($rest | Select-String -Pattern '^## \[' | Select-Object -First 1).LineNumber
          $section = if ($end) { $rest[0..($end - 2)] } else { $rest }
          $intro = @(
            "Audiobook Downloader $version for Windows 10 and 11 (64-bit). Download ``AudiobookDownloader-Setup-$version.exe`` below to install it (no administrator rights needed), or ``AudiobookDownload.exe`` to run it from any folder without installing. Either way, the app updates itself from now on.",
            "",
            "Windows SmartScreen may warn the first time because the file is not code-signed: choose More info, then Run anyway. For personal backups of books you own only.",
            ""
          )
          ($intro + $section) -join "`n" | Out-File -Encoding utf8 release-notes.md
          Get-Content release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $setup = (Get-ChildItem release -Filter 'AudiobookDownloader-Setup-*.exe' | Select-Object -First 1).FullName
          gh release create $tag $setup release/AudiobookDownload.exe `
            --title "Audiobook Downloader ${{ steps.version.outputs.version }}" `
            --notes-file release-notes.md `
            --target ${{ github.sha }}
