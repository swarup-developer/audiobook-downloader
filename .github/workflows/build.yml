# Builds the app and runs its self-test on every push and pull request, so a change
# that breaks the build, a window's accessibility or a translation is caught on GitHub.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build AudiobookDownloader.sln -c Release

      - name: Self-test
        shell: pwsh
        run: |
          $exe = Get-ChildItem src/AudiobookDownloader.WinForms/bin/Release -Recurse -Filter AudiobookDownloader.WinForms.exe | Select-Object -First 1
          # A Windows app returns at once when started from a shell, so wait for it.
          $run = Start-Process -FilePath $exe.FullName -ArgumentList '--self-test', 'self-test-report.txt' -Wait -PassThru
          Get-Content self-test-report.txt
          if ($run.ExitCode -ne 0) { throw "The self-test found problems (exit code $($run.ExitCode))." }

      - name: Keep the self-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-test-report
          path: self-test-report.txt
          if-no-files-found: ignore

      # The same single-file exe a release has, kept with the run for testing before
      # a release. Download it from the run's page under Artifacts.
      - name: Build the single-file exe
        shell: pwsh
        run: |
          dotnet publish src/AudiobookDownloader.WinForms/AudiobookDownloader.WinForms.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -o out
          New-Item -ItemType Directory -Force app | Out-Null
          Move-Item out/AudiobookDownloader.WinForms.exe app/AudiobookDownload.exe

      - name: Self-test the exe on its own
        shell: pwsh
        run: |
          $run = Start-Process -FilePath app/AudiobookDownload.exe -ArgumentList '--self-test', "$PWD/exe-self-test.txt" -WorkingDirectory app -Wait -PassThru
          Get-Content exe-self-test.txt | Select-Object -Last 3
          if ($run.ExitCode -ne 0) { throw "The exe's self-test found problems (exit code $($run.ExitCode))." }

      - name: Build the installer
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Select-Object -First 1
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$version" "/DSourceExe=$PWD\app\AudiobookDownload.exe" "/O$PWD\app" installer\AudiobookDownloader.iss
          if ($LASTEXITCODE -ne 0) { throw 'The installer could not be built.' }

      - name: Install, self-test the installed copy, uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem app -Filter 'AudiobookDownloader-Setup-*.exe' | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'installed'
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$dir" -Wait
          # Setup starts the app when it finishes, as it does after an update.
          Start-Sleep -Seconds 5
          Get-Process AudiobookDownload -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not (Test-Path "$dir\AudiobookDownload.exe")) { throw 'The installer did not install the app.' }
          if (-not (Test-Path "$dir\unins000.exe")) { throw 'The installer did not install an uninstaller.' }
          $run = Start-Process "$dir\AudiobookDownload.exe" -ArgumentList '--self-test', "$PWD/installed-self-test.txt" -WorkingDirectory $dir -Wait -PassThru
          Get-Content installed-self-test.txt | Select-Object -Last 3
          if ($run.ExitCode -ne 0) { throw "The installed app's self-test found problems." }
          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\AudiobookDownload.exe") { throw 'Uninstalling left the app behind.' }

      - name: Keep the exe and the installer
        uses: actions/upload-artifact@v4
        with:
          name: AudiobookDownload-${{ github.sha }}
          path: |
            app/AudiobookDownload.exe
            app/AudiobookDownloader-Setup-*.exe
          retention-days: 30
